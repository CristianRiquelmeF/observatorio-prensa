name: Observatorio Prensa ETL

on:
  schedule:
    # Ejecuta todos los días a las 13:00 AM UTC (10:00 AM en Chile continental)
    - cron: '27 13 * * *'
  workflow_dispatch: # Activa un botón en GitHub para ejecutarlo manualmente cuando quieras

jobs:
  extraccion_y_nlp:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Guarda las librerías en caché para que las ejecuciones de mañana sean más rápidas

    - name: Instalar librerías
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar Pipeline ETL
      env:
        # Pasa los secrets de GitHub al entorno de Python
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python etl_pipeline.py
